<style>

@keyframes bl{0%,100%{background:var(--rose2);box-shadow:0 0 0 3px var(--gold)}50%{background:var(--card);box-shadow:0 0 0 3px transparent}}.new{animation:bl .5s ease-in-out 6}

.cal span{display:block;height:9px}.cal u{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ag-dot1,var(--rose));margin:0 1px}.cal u.g2{background:var(--ag-dot2,var(--gold))}.cal .sel{background:var(--ag-sel,var(--rose2));color:var(--ag-selt,var(--rose));font-weight:700;border-color:var(--ag-selb,var(--rose))}.cal .tod{border-color:var(--ag-dot2,var(--gold))}.agx h3{color:var(--ag-date,var(--gold))}.nv{border:0;background:none;color:var(--mut);font-size:1.6rem;padding:2px 14px;cursor:pointer}

.enc{background:var(--enc);border:1px solid var(--gold);border-radius:30px;padding:4px 12px 8px;margin:8px 0 14px}.enc h3{margin:8px 0 2px}.enr{background:var(--enc)!important;border-color:var(--gold)!important}.mini{padding:7px 12px;border-radius:99px;background:var(--rose2);font-size:.8rem;text-decoration:none;color:var(--btn2t,var(--ink));white-space:nowrap}
.strip{display:flex;height:34px;border-radius:999px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}.strip i{flex:1}.pr a,.sw2{-webkit-user-drag:none}

.pool{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}.pc{position:relative}.sw2{display:inline-block;position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;flex:none}.sw2 input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}.sw2.over{outline:3px solid var(--gold);outline-offset:2px}.sw2.add{background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--mut);border-style:dashed;cursor:pointer}.x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;cursor:pointer}.rl{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;margin:6px 0;gap:10px}
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

#bgfx i:nth-child(odd){animation:dr1 19s ease-in-out infinite alternate}#bgfx i:nth-child(even){animation:dr2 23s ease-in-out infinite alternate}#bgfx i:nth-child(3){animation-duration:27s}

#fxp{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
#fxp b{position:absolute;top:0;width:var(--z,12px);height:var(--z,12px);border-radius:50%;opacity:0}

body[data-fx=fly] #fxp b{top:var(--tp);width:calc(var(--z)*.8);height:calc(var(--z)*.8);background:radial-gradient(circle,#fffbd0 0,#ffe566 38%,rgba(255,229,102,0) 72%);box-shadow:0 0 14px 4px rgba(255,214,90,.5);animation:wander calc(var(--pd)/1.3) ease-in-out var(--pl) infinite,glow calc(var(--pd)/5) ease-in-out var(--pl) infinite,squash calc(var(--pd)/6) ease-in-out var(--pl) infinite alternate}
body[data-fx=conf] #fxp b{width:calc(var(--z)*.55);height:calc(var(--z)*.95);border-radius:2px;background:var(--rose);animation:fall calc(var(--pd)*.55) linear var(--pl) infinite,spinr calc(var(--pd)/6) linear var(--pl) infinite,flip calc(var(--pd)/9) linear var(--pl) infinite}
body[data-fx=conf] #fxp b:nth-child(3n){background:var(--gold)}body[data-fx=conf] #fxp b:nth-child(3n+1){background:#fff;border:1px solid var(--rose2)}body[data-fx=conf] #fxp b:nth-child(5n){background:var(--rose2)}
body[data-fx=bub] #fxp b:nth-child(n+17),body[data-fx=sakura] #fxp b:nth-child(n+23),body[data-fx=heart] #fxp b:nth-child(n+15),body[data-fx=fly] #fxp b:nth-child(n+15),body[data-fx=conf] #fxp b:nth-child(n+25){display:none}
@keyframes rise{0%{translate:0 108vh;opacity:0}12%,88%{opacity:var(--pa,.4)}100%{translate:0 -12vh;opacity:0}}
@keyframes fall{0%{translate:0 -8vh;opacity:0}10%,90%{opacity:var(--pa,.7)}100%{translate:0 108vh;opacity:0}}
@keyframes sway3{from{transform:translateX(calc(var(--dir)*-26px))}to{transform:translateX(calc(var(--dir)*26px))}}
@keyframes flutter{from{scale:1 1}to{scale:calc(1 + .5*var(--st)) calc(1 - .38*var(--st))}}
@keyframes spinr{to{rotate:calc(var(--dir)*360deg)}}
@keyframes wobble{from{scale:1.2 .82;rotate:calc(var(--dir)*-18deg)}to{scale:.84 1.22;rotate:calc(var(--dir)*18deg)}}

 try{pack=JSON.parse(await file.text());if(pack.format==='nail-studio-manager-backup'&&pack.data){if(!Array.isArray(pack.data.clients)||!Array.isArray(pack.data.visits)||!Array.isArray(pack.images))throw new Error('estructura incompleta')}else if(Array.isArray(pack.clients)&&Array.isArray(pack.visits)){pack={format:'legacy',data:pack,images:[],wallpaper:null}}else throw new Error('formato no reconocido')}
 catch(e){return toast('El archivo de respaldo no es válido')}
 cf('Se reemplazarán los datos actuales. ¿Restaurar también las fotos incluidas en el archivo?',async()=>{try{
  const incoming=Object.assign({clients:[],visits:[],log:[],appts:[],anul:[],photos:[],pal:{list:[],act:0},set:{},seq:1},pack.data);incoming.set=Object.assign({},DEF,incoming.set);
  await idbDo('readwrite',o=>o.clear());
  for(const im of (pack.images||[])){const full=dataURLBlob(im.full),thumb=dataURLBlob(im.thumb||im.full);if(!full)throw new Error('una foto del respaldo está dañada');await putP({id:+im.id,full,thumb})}
  if(pack.wallpaper&&pack.wallpaper.full){const full=dataURLBlob(pack.wallpaper.full);await putP({id:-1,full,thumb:dataURLBlob(pack.wallpaper.thumb||pack.wallpaper.full)})}
  S=incoming;save();Object.keys(URLC).forEach(k=>delete URLC[k]);go('home');toast('Respaldo restaurado: '+S.clients.length+' clientes y '+(pack.images||[]).length+' fotos');
 }catch(e){console.error(e);toast('No se pudo restaurar el respaldo: '+(e.message||'error de almacenamiento'))}})
}
